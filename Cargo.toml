[workspace]
resolver = "2"
members = [
    "bin/zk-deployer",
    "lib/server",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
lib-server = { path = "lib/server" }
zk-deployer = { path = "bin/zk-deployer" }

alloy = { version = "2.0.5", default-features = false }
anyhow = "1.0"
chrono = "0.4"
clap = "4.5"
flate2 = "1.0"
fs2 = "0.4.3"
futures = "0.3"
hex = "0.4"
human-panic = "2.0"
# Atomic-interop contracts: the merged tip of `atomic-imt-interop` (era-contracts#2218 merged it into
# `atomic-imt-interop-release` and deleted the branch), plus the genesis protocol-version bump to
# v0.32.0 that the merged server requires — see era-contracts#2373, which ports the same bump to
# draft-v32. Re-point at upstream once that bump reaches the atomic-interop line.
#
# Not the release branch: it moved the atomic proof onto the height-3 ChainBatchRootTree (IMT
# begin/end roots as chain-batch-root leaves 2/3, era-contracts#2335), which zksync-os-server does not
# produce yet — it still commits `keccak256(logsRoot ++ multichainRoot)`. Moving to it means rebuilding
# the leg proofs in `tests/src/atomic_swap` against the new `ImtProof` once the server publishes that
# layout.
protocol_ops = { git = "https://github.com/kelemeno/era-contracts", rev = "90443d29de760f917e685da3f268a5a1f14c738a" }
zksync_os_genesis_gen = { package = "zksync-os-genesis-gen", git = "https://github.com/kelemeno/era-contracts", rev = "90443d29de760f917e685da3f268a5a1f14c738a" }
reth-tasks = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.3.0" }
rstest = "0.26.1"
serde = "1.0"
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.11"
smart-config = "0.4.0-pre.4"
tar = "0.4"
tempfile = "3"
thiserror = "2.0"
tokio = "1"
toml = "1.1.2"
tracing = "0.1"
tracing-subscriber = "0.3"
# The L1 aggregation-hop proof landed on server `main` as zksync-os-server#1413; this rev is its merge
# commit. Pinned rather than tracking `main` because everything after it (zksync-os 0.4.0, #1421)
# requires nightly-2026-02-10, while the atomic-interop contracts rev above still pins airbender
# v0.4.3, which does not build on that toolchain. Both move together, not separately.
zksync_os_server = { git = "https://github.com/matter-labs/zksync-os-server", rev = "597489700bc45d61437e829305c8aa6517548958" }
zksync_os_state_full_diffs = { git = "https://github.com/matter-labs/zksync-os-server", rev = "597489700bc45d61437e829305c8aa6517548958" }

# Local-checkout overrides for these git deps are DEV-ONLY and must not be committed.
# Put them in a local `[patch]` (e.g. a git-ignored Cargo override / your own working copy),
# never here — CI resolves the git refs declared above.

[profile.release]
# This is needed for zksync-airbender crates to compile in a reasonable time for x86-64-unknown-linux-gnu
overflow-checks = true
