[workspace]
resolver = "2"
members = [
    "bin/zk-deployer",
    "lib/server",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
lib-server = { path = "lib/server" }
zk-deployer = { path = "bin/zk-deployer" }

alloy = { version = "2.0.5", default-features = false }
anyhow = "1.0"
chrono = "0.4"
clap = "4.5"
flate2 = "1.0"
fs2 = "0.4.3"
futures = "0.3"
hex = "0.4"
human-panic = "2.0"
# TODO: re-point at the release branch once the atomic-interop DA work merges.
protocol_ops = { git = "https://github.com/matter-labs/era-contracts", branch = "atomic-imt-reduced" }
zksync_os_genesis_gen = { package = "zksync-os-genesis-gen", git = "https://github.com/matter-labs/era-contracts", branch = "atomic-imt-reduced" }
reth-tasks = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.3.0" }
rstest = "0.26.1"
serde = "1.0"
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.11"
smart-config = "0.4.0-pre.4"
tar = "0.4"
tempfile = "3"
thiserror = "2.0"
tokio = "1"
toml = "1.1.2"
tracing = "0.1"
tracing-subscriber = "0.3"
# TODO: re-point at main once the atomic-interop server work (rebased onto the 0.4.0
# native-batch-PIG line) merges.
zksync_os_server = { git = "https://github.com/matter-labs/zksync-os-server", branch = "ad-atomic-interop-timestamps-0.4.0" }
zksync_os_state_full_diffs = { git = "https://github.com/matter-labs/zksync-os-server", branch = "ad-atomic-interop-timestamps-0.4.0" }

# Local-checkout overrides for these git deps are DEV-ONLY and must not be committed.
# Put them in a local `[patch]` (e.g. a git-ignored Cargo override / your own working copy),
# never here — CI resolves the git branches declared above.

[profile.release]
# This is needed for zksync-airbender crates to compile in a reasonable time for x86-64-unknown-linux-gnu
overflow-checks = true
