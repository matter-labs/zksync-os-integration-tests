[package]
name = "lib-anvil"
version = "0.1.0"
edition = "2021"

[dependencies]
alloy-primitives = { version = "0.8", default-features = false, features = ["std"] }
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
alloy-primitives = { version = "0.8", default-features = false, features = ["std"] }
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1.0"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
