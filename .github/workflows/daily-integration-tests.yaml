name: Daily Integration Tests

on:
  schedule:
    # 12:00 UTC Monday–Friday
    - cron: "0 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: daily-integration-tests
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  TEST_RESULTS_XML: 'test-results.xml'

jobs:
  daily-integration-tests:
    name: Run integration tests (full cold setup)
    runs-on: matterlabs-ci-runner-high-performance
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup runner
        uses: ./.github/actions/runner-setup
        with:
          enable_cache: 'true'
          save_cache: 'true'

      # The daily run deliberately rebuilds every deployment snapshot from
      # scratch (ZKOS_CACHE=refresh): it validates the full cold path daily
      # and republishes fresh snapshots for PR runs to restore.
      - name: Run integration tests (cold)
        env:
          ZKOS_CACHE: refresh
        run: cargo nextest run -p tests --release

      - name: Save deployment snapshot cache
        if: always() && !cancelled()
        uses: actions/cache/save@v4
        with:
          path: .zkos-test-cache
          key: zkos-deployments-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}

      - name: Publish test results
        if: always() && !cancelled()
        uses: EnricoMi/publish-unit-test-result-action@3a74b2957438d0b6e2e61d67b05318aa25c9e6c6 # v2.20.0
        with:
          check_name: 'Daily integration test results'
          files: target/nextest/default/${{ env.TEST_RESULTS_XML }}
          action_fail_on_inconclusive: true
          compare_to_earlier_commit: false

  notify-on-failure:
    name: Notify Slack on failure
    needs: daily-integration-tests
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack Notification
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "❌ Daily *integration tests* just failed <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Failed run link>"
