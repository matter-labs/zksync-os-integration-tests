name: ZKsync OS Integration Tests (v30→v31 Upgrade)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-tests-upgrade-v31-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests-upgrade-v31:
    runs-on: matterlabs-ci-runner-high-performance
    timeout-minutes: 120
    env:
      DEBIAN_FRONTEND: noninteractive
      WORKSPACE: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libclang-dev \
            libssl-dev \
            pkg-config \
            jq \
            wget \
            curl

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-02-20

      - name: Install Foundry
        run: |
          mkdir -p foundry
          curl -LO https://github.com/foundry-rs/foundry/releases/download/v1.5.1/foundry_v1.5.1_linux_amd64.tar.gz
          tar zxf foundry_v1.5.1_linux_amd64.tar.gz -C ./foundry
          chmod +x ./foundry/*
          echo "${PWD}/foundry" >> "${GITHUB_PATH}"

      - name: Build all crates
        run: cargo build --release --workspace

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run integration tests
        run: ./run-tests.sh --presets presets-upgrade-v31.yaml

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs-upgrade-v31
          path: |
            test-run-logs/
            l1-state-cache/
