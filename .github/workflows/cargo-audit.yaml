name: Security audit

on:
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  schedule:
    # Run every Monday-Friday at 8:30 AM UTC.
    - cron: "30 8 * * 1-5"

# Prevent multiple runs for the same pull request or branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Set permissions
permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit@0.22.0
      - name: Run cargo audit
        # RUSTSEC-2025-0055: tracing-subscriber 0.2.x pulled in by ark-relations
        # (transitive dep of zksync-os); not fixable from this repo.
        run: cargo audit --ignore RUSTSEC-2025-0055

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      # The container action has a separate HOME and cannot see the Git URL
      # rewrite configured on the runner, so private dependencies must be
      # checked with cargo-deny installed directly on the host.
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny@0.18.6

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure private repo auth
        uses: ./.github/actions/private-git-auth
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Run cargo-deny
        # Advisories are handled by the cargo-audit job above.
        run: cargo deny --manifest-path ./Cargo.toml check --hide-inclusion-graph bans licenses sources
