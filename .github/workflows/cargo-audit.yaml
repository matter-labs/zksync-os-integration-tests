name: Security audit

on:
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  schedule:
    # Run every Monday-Friday at 8:30 AM UTC.
    - cron: "30 8 * * 1-5"

# Prevent multiple runs for the same pull request or branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Set permissions
permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit@0.22.0
      - name: Run cargo audit
        # RUSTSEC-2025-0055: tracing-subscriber 0.2.x pulled in by ark-relations
        # (transitive dep of zksync-os); not fixable from this repo.
        # RUSTSEC-2026-0194 / RUSTSEC-2026-0195: quick-xml <0.41 DoS, pulled only by
        # `inferno` (flamegraph tooling) deep inside zksync-airbender (tag-pinned);
        # bumping is blocked upstream and it is not on any runtime path.
        # RUSTSEC-2026-0235: rkyv <0.8.17 OOB read when validating archives with Rc/Arc.
        # Reached only via openraft -> byte-unit -> rust_decimal, which pins `rkyv ^0.7`;
        # 1.42.1 is the latest rust_decimal, so 0.8.x is unreachable from this repo. We never
        # deserialize rkyv archives (it backs rust_decimal's optional archive support), so the
        # vulnerable path is not exercised.
        run: cargo audit --ignore RUSTSEC-2025-0055 --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195 --ignore RUSTSEC-2026-0235

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@76cd80eb775d7bbbd2d80292136d74d39e1b4918 # v2.0.14
        with:
          manifest-path: "./Cargo.toml"
          rust-version: "none"
          command: check
          # advisories are handled by the cargo-audit job above
          command-arguments: "--hide-inclusion-graph bans licenses sources"
