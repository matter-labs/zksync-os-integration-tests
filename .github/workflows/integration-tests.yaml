name: ZKsync OS Integration Tests

on:
  pull_request:
  push:
    branches: ['main']
  workflow_dispatch:

# Cancel new runs for PRs only
concurrency:
  group: integration-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  TEST_RESULTS_XML: 'test-results.xml'

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  integration-tests:
    runs-on: matterlabs-ci-runner-high-performance
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup runner
        uses: ./.github/actions/runner-setup
        with:
          enable_cache: 'true'
          # Only main-branch runs refresh the shared Rust build cache.
          save_cache: ${{ github.event_name == 'push' && 'true' || 'false' }}

      # Deployment snapshots (.zkos-test-cache) are content-addressed
      # internally — stale entries restored here are simply never matched,
      # so a fuzzy actions/cache key is safe. Entries are produced by the
      # daily workflow (full cold runs) and by main-branch pushes.
      - name: Restore deployment snapshot cache
        uses: actions/cache/restore@v4
        with:
          path: .zkos-test-cache
          key: zkos-deployments-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            zkos-deployments-${{ hashFiles('Cargo.lock') }}-
            zkos-deployments-

      - name: Run integration tests
        run: cargo test --release

      - name: Save deployment snapshot cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: .zkos-test-cache
          key: zkos-deployments-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
