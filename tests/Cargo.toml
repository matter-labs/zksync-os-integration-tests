[package]
name = "tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
lib-server = { workspace = true, features = ["embedded-server"] }
zk-deployer = { workspace = true }
protocol_ops_v31 = { package = "protocol_ops", git = "https://github.com/matter-labs/era-contracts", rev = "e091691063c99a1d0281d6fe42fb0ec4430f3673" }

alloy = { workspace = true, features = [
    "node-bindings",
    "provider-anvil-api",
    "providers",
    "transport-http",
    "reqwest",
    "signer-local",
    "network",
    "sol-types",
] }
anyhow = { workspace = true }
fs2 = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
rstest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
