[package]
name = "tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
lib-server = { workspace = true, features = ["embedded-server"] }
zk-deployer = { workspace = true }
protocol_ops = { workspace = true }

alloy = { workspace = true, features = [
    "node-bindings",
    "provider-anvil-api",
    "providers",
    "transport-http",
    "reqwest",
    "signer-local",
    "network",
    "sol-types",
    # `json` lets the artifact-sourced `sol!` bindings (see build.rs) parse inline ABI JSON.
    "json",
] }
anyhow = { workspace = true }
fs2 = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
rstest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }
toml = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[build-dependencies]
# build.rs calls `protocol_ops::common::paths::contracts_root()` to locate the era-contracts
# checkout, then reads its committed zkstack-out ABIs to generate the atomic-interop bindings.
protocol_ops = { workspace = true }
