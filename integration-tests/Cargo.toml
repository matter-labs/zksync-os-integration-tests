[package]
name = "integration-tests"
version = "0.1.0"
edition = "2021"

[dependencies]
# Pin to avoid zerocopy 0.8.39 which requires unstable stdarch_x86_avx512 (Rust 1.89+)
zerocopy = "0.8.38"
alloy = { version = "0.3", default-features = false, features = ["provider-anvil-node", "json-rpc"] }
chrono = "0.4"
anyhow = "1.0"
fs2 = "0.4"
reqwest = { version = "0.11", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
toml = "0.8"
scopeguard = "1.2"
thiserror = "1.0"
tokio = { version = "1.0", features = ["net", "time", "macros", "rt", "test-util"] }
uuid = { version = "1.0", features = ["v4"] }
