[package]
name = "integration-tests"
version = "0.1.0"
edition = "2021"

[dependencies]
alloy = { version = "0.3", default-features = false, features = [
    "provider-anvil-node",
    "json-rpc",
    "signer-local",
    "reqwest",
    "reqwest-rustls-tls",
    "contract",
] }
chrono = "0.4"
flate2 = "1.0"
anyhow = "1.0"
fs2 = "0.4"
reqwest = { version = "0.11", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
toml = "0.8"
scopeguard = "1.2"
thiserror = "1.0"
tokio = { version = "1.0", features = ["net", "time", "macros", "rt", "rt-multi-thread", "test-util"] }
uuid = { version = "1.0", features = ["v4"] }
sha2 = "0.10"
